version: 2
project_name: git-annex-remote-s5cmd
dist: dist-git-annex-remote-s5cmd
builds:
  - id: git-annex-remote-s5cmd
    dir: ./go/git-annex-remote-s5cmd
    main: .
    binary: git-annex-remote-s5cmd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.appVersion={{ .Version }}
archives:
  - id: git-annex-remote-s5cmd
    builds: [git-annex-remote-s5cmd]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
release:
  skip_upload: true
