name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    outputs:
      website-exists: ${{ steps.check-website.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Check website directory exists
        id: check-website
        run: |
          if [ -d website ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "website/ directory not found — skipping Hugo build"
          fi

      - name: Setup Pages
        if: steps.check-website.outputs.exists == 'true'
        uses: actions/configure-pages@v5

      - name: Install Hugo
        if: steps.check-website.outputs.exists == 'true'
        run: |
          HUGO_VERSION="0.147.9"
          BASE_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          TARBALL="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          # Download and verify from /tmp using the archive's real filename, so
          # `sha256sum --check` (which reads the name from the checksum line)
          # finds the file in the current dir.
          cd /tmp
          curl -sSfL "${BASE_URL}/${TARBALL}" -o "${TARBALL}"
          curl -sSfL "${BASE_URL}/hugo_${HUGO_VERSION}_checksums.txt" -o hugo_checksums.txt
          grep "${TARBALL}" hugo_checksums.txt | sha256sum --check --status
          tar -xz -C /usr/local/bin -f "${TARBALL}" hugo
          rm "${TARBALL}" hugo_checksums.txt
          hugo version

      # The Hugo theme (tailbliss) is a git submodule upstream and is not stored
      # in this repo (it's a generated mirror). Fetch it at build time, pinned to
      # the same commit the internal repo uses, so the build is reproducible.
      - name: Fetch Hugo theme (tailbliss)
        if: steps.check-website.outputs.exists == 'true'
        run: |
          THEME_SHA="d3cdd5c5ae12ecc78df971bff2d93e15a50b7c55"
          rm -rf website/themes/tailbliss
          git clone https://github.com/nusserstudios/tailbliss.git website/themes/tailbliss
          git -C website/themes/tailbliss checkout "$THEME_SHA"

      - name: Build Hugo site
        if: steps.check-website.outputs.exists == 'true'
        run: hugo --environment oss --minify --baseURL "https://genentech.github.io/exohub/"
        working-directory: website

      - name: Upload Pages artifact
        if: steps.check-website.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.website-exists == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
