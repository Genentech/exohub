{{ define "main" }}
<article>
  <!-- Page header with gradient banner -->
  <header class="mb-4 bg-primary-600">
    <div class="px-4 py-12 md:py-20">
      <div class="mx-auto max-w-4xl text-center">
        <!-- Badges -->
        <div class="tip-single-badges">
          {{ with .Params.category }}
          <span class="tip-badge tip-badge-category tip-badge-{{ . }}">{{ . }}</span>
          {{ end }}
          {{ with .Params.difficulty }}
          <span class="tip-badge tip-badge-difficulty tip-badge-diff-{{ . }}">{{ . }}</span>
          {{ end }}
        </div>
        <h1 class="mt-4 text-white text-4xl md:text-5xl font-black leading-tight break-words">
          {{ .Title }}
        </h1>
        <p class="mt-3 text-white/70 text-sm">
          {{ .Date.Format "January 2, 2006" }}
          {{ with .Params.command }}
          &nbsp;·&nbsp; <code class="tip-single-command">{{ . }}</code>
          {{ end }}
        </p>
      </div>
    </div>
  </header>

  <!-- Content -->
  <div class="px-6 pt-6 pb-16 mx-auto prose prose-h1:text-2xl dark:text-white max-w-3xl">
    {{.Content}}
  </div>

  <!-- Back link -->
  <div class="mx-auto max-w-3xl px-6 pb-16">
    <a href="/tips/" class="tip-back-link">
      ← Back to all tips
    </a>
  </div>
</article>
{{ end }}
