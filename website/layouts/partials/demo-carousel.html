{{ with .Site.Params.DemoCarousel }}
<div class="px-4 py-12 mx-auto max-w-screen-xl text-center"
     x-data="demoCarousel({{ . | jsonify }})"
     x-init="init()">

    <h2 class="mb-8 text-3xl font-bold tracking-tight text-gray-900 dark:text-gray-50 sm:text-4xl">
        ExoHub in Action
    </h2>

    {{/* Slide labels (tab strip) */}}
    <div class="flex justify-center gap-2 mb-6 flex-wrap">
        <template x-for="(slide, i) in slides" :key="i">
            <button
                @click="go(i)"
                :class="current === i
                    ? 'bg-primary-500 text-white'
                    : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'"
                class="px-4 py-1.5 rounded-full text-lg font-mono font-medium transition-colors cursor-pointer hover:scale-105"
                x-text="slide.label">
            </button>
        </template>
    </div>

    {{/* Video frame with arrows */}}
    <div class="flex items-center justify-center gap-4 mx-auto max-w-5xl">
        {{/* Left arrow */}}
        <button @click="prev()"
            class="flex-shrink-0 text-8xl font-bold transition-all hover:scale-125 cursor-pointer opacity-60 hover:opacity-100"
            style="color: var(--brand-grad-start);">
            &#8249;
        </button>

        <div class="flex-1 max-w-4xl relative rounded-2xl shadow-xl"
             :style="'padding: 3px; background: conic-gradient(from 0deg at 50% 50%, #e96e1f ' + Math.max(0, progress * 3.6 - 30) + 'deg, #4b5563 ' + (progress * 3.6) + 'deg)'">
            <div class="overflow-hidden bg-gray-900" style="border-radius: 13px; aspect-ratio: 900/590;">
                <video
                    x-ref="video"
                    muted playsinline
                    class="w-full h-full object-contain">
                </video>
            </div>
        </div>

        {{/* Right arrow */}}
        <button @click="next()"
            class="flex-shrink-0 text-8xl font-bold transition-all hover:scale-125 cursor-pointer opacity-60 hover:opacity-100"
            style="color: var(--brand-grad-start);">
            &#8250;
        </button>
    </div>

    {{/* Caption */}}
    <p class="mt-4 text-lg leading-7 text-gray-500 dark:text-gray-400 mx-auto max-w-4xl" x-html="slides[current].caption"></p>

    {{/* Dots */}}
    <div class="flex justify-center gap-2 mt-4">
        <template x-for="(slide, i) in slides" :key="i">
            <button
                @click="go(i)"
                :class="current === i ? 'bg-primary-500 w-6' : 'bg-gray-300 dark:bg-gray-600 w-2'"
                class="h-2 rounded-full transition-all duration-300 cursor-pointer">
            </button>
        </template>
    </div>
</div>

<script>
function demoCarousel(slides) {
    return {
        slides,
        current: 0,
        progress: 0,

        init() {
            this.go(0);
        },

        go(i) {
            this.current = i;
            this.progress = 0;

            const video = this.$refs.video;
            const src = '/images/demo/' + this.slides[i].src;

            video.ontimeupdate = null;
            video.onended = null;

            video.src = src;
            video.load();
            video.currentTime = 0;

            const play = () => {
                video.play().catch(() => {});
                video.ontimeupdate = () => {
                    if (video.duration && isFinite(video.duration)) {
                        this.progress = (video.currentTime / video.duration) * 100;
                    }
                };
                video.onended = () => this.next();
            };

            if (video.readyState >= 2) {
                play();
            } else {
                video.addEventListener('canplay', play, { once: true });
            }
        },

        next() { this.go((this.current + 1) % this.slides.length); },
        prev() { this.go((this.current - 1 + this.slides.length) % this.slides.length); },
    }
}
</script>
{{ end }}
