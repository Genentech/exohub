  <path d="M7 3a1 1 0 0 0 0 2h2.586l2 2H11a2 2 0 0 0-2 2v1.586l-3 3V13a2 2 0 1 0 2 2v-.586l3-3V14a2 2 0 1 0 2 0V9h1.586l2 2V9.414l-2-2V5a2 2 0 0 0-2-2H7z"/>

{{- else if eq $n "cli" -}}
<svg class="w-5 h-5 text-primary-500 flex-shrink-0 mt-1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5zm4.5 4.5L5 12l2.5 2.5 1.5-1.5L8 12l1.5-1.5-1.5-1.5zm4.5 5h5v-2h-5v2z"/>

{{- else if eq $n "gate" -}}
<svg class="w-5 h-5 text-primary-500 flex-shrink-0 mt-1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="M7 4h10a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm2 3v10h6V7H9z"/>

{{- else if eq $n "space" -}}
<svg class="w-5 h-5 text-primary-500 flex-shrink-0 mt-1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="M12 2a7 7 0 1 0 7 7c0-.34-.03-.67-.08-1a5 5 0 0 1-5.92 5.92c.33 2.1 1.97 3.92 4.08 4.5a9 9 0 1 1-5.08-16.42z"/>
</svg>
{{- else if eq $n "workers" -}}
<svg class="w-5 h-5 text-primary-500 flex-shrink-0 mt-1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="M7 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm10 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM7 17a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm10 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM7 7h10v10H7V7z"/>
</svg>
{{- else if eq $n "tips" -}}
<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M12 2a7 7 0 0 1 5.292 11.67c-.592.717-.792 1.404-.792 2.08V17a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-1.25c0-.676-.2-1.363-.792-2.08A7 7 0 0 1 12 2zm3 17v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1h6z"/>
</svg>
{{- else if eq $n "atlas" -}}
<svg class="atlas-solar mr-3" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="atlas-sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#FF3D81"/>
    </linearGradient>
  </defs>
  <!-- Orbit tracks -->
  <circle cx="18" cy="18" r="7" fill="none" stroke="#FF7A18" stroke-width=".7" opacity=".5"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="#FF3D81" stroke-width=".7" opacity=".45"/>
  <circle cx="18" cy="18" r="15.5" fill="none" stroke="#A100FF" stroke-width=".7" opacity=".4"/>
  <!-- Sun -->
  <circle cx="18" cy="18" r="3" fill="url(#atlas-sun-grad)"/>
  <!-- Planet 1 — inner orbit -->
  <g class="atlas-orbit atlas-orbit-1">
    <circle cx="25" cy="18" r="1.4" fill="#FF7A18"/>
  </g>
  <!-- Planet 2 — middle orbit -->
  <g class="atlas-orbit atlas-orbit-2">
    <circle cx="29" cy="18" r="1.8" fill="#FF3D81"/>
  </g>
  <!-- Planet 3 — outer orbit -->
  <g class="atlas-orbit atlas-orbit-3">
    <circle cx="33.5" cy="18" r="1.2" fill="#A100FF"/>
  </g>
</svg>
{{- end -}}
