# ExoSyncWorkflow (annex) manifest example
#
# Notes:
# - Use `exo submit --manifest <file>` to submit this manifest to an ExoHub Worker for execution.
# - This manifest can also be used directly from the CLI (eg. `exo sync --manifest <file>`).
# - Paths apply to annex content sync only.

# Required: repository identity for pull
name: my-dataset
url: https://github.com/example/data-repo.git
ref: v1.2.3
queue: exohub-sync-aws # or exohub-sync-shpc
# - exohub-sync-aws targets an ExoHub Worker in the cloud, e.g. sync from S3 to a local volume.
# - exohub-sync-shpc targets an ExoHub Worker in sHPC (ExoGate), e.g. sync from Exospace cache/folders to S3.

# Optional: where the repo is checked out/used
# If omitted, the worker defaults to EXOHUB_TMP/<name>
repo-dir: /data/work/my-dataset

# What to run within ExoSyncWorkflow
# - Include "annex" to run git-annex content/metadata sync
# - Include "export" to run an export from one special remote to another
remote-type: annex

# Restrict to specific remotes (omit to sync with all)
with-remotes:
  - s3-private
  - gcs-public

# Restrict content sync to specific repo paths/globs (optional)
paths:
  - data/**
  - results/*.tsv

# Example usage:
#   exo submit --manifest manifests/annex-manifest.yaml --queue exohub-sync-aws
#   exo sync --manifest manifests/annex-manifest.yaml
